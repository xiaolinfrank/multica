# BayClaw 服务日志轮转（logrotate）
#
# 背景：server.log 曾在 49 天里长到 5.9GB（daemon 心跳是 DEBUG 级、高频）。
# server/web 都是 `nohup ... >> logs/*.log 2>&1` 启动，进程持有一个 O_APPEND
# 的文件描述符、且不响应 SIGHUP 重开日志。因此必须用 copytruncate：先把内容
# 拷进轮转文件，再原地截断原文件 —— inode 不变、fd 不失效、O_APPEND 保证续写
# 从文件尾开始（不产生 sparse hole）。全程不重启服务。
#
# 触发：由 launchd 周期性调用 logrotate（见
# ~/Library/LaunchAgents/com.bayclaw.logrotate.plist）。logrotate 不常驻，每次
# 运行检查各日志是否超阈值，超了就轮转。
#
# 注意：size 指令行内不能带非 ASCII 注释，否则 logrotate 会把多字节字符误当成
# 单位而报错，故注释一律独立成行。

# server.log：心跳噪声主源，约 120MB/天（DEBUG 级）。按大小轮转，约一天一档，
# 保留 14 档（压缩后很小），日期后缀便于回溯。
/Users/fosun_main_agent/var/multica/logs/server.log {
	size 100M
	rotate 14
	compress
	delaycompress
	copytruncate
	missingok
	notifempty
	dateext
	dateformat -%Y%m%d-%H%M%S
}

# web.log：Next.js 生产服务日志，量小，同一套 copytruncate 策略。
/Users/fosun_main_agent/var/multica/logs/web.log {
	size 50M
	rotate 10
	compress
	delaycompress
	copytruncate
	missingok
	notifempty
	dateext
	dateformat -%Y%m%d-%H%M%S
}

# 注：Caddy 的两个日志（caddy.log、caddy-access.log）由 Caddyfile 内建的
# roll_size/roll_keep 自轮转，不走这里，避免两个轮转器互相打架。
